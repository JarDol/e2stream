name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/e2stream-$V.apk"
          echo "VER=$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: e2stream-${{ env.VER }}
          path: out/*.apk

      - name: GitHub Release dla nowej wersji (push na main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER już istnieje — pomijam"
          else
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md
            gh release create "v$VER" out/*.apk --title "E2Stream $VER" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: GitHub Release (ręcznie wypchnięty tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
