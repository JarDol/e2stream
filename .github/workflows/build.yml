name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/e2stream-$V.apk"
          echo "VER=$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: e2stream-${{ env.VER }}
          path: out/*.apk

      - name: GitHub Release dla wersji z build.gradle.kts
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md || true
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER istnieje — aktualizuję tag, plik i opis"
            git tag -f "v$VER" "$GITHUB_SHA"
            git push -f origin "refs/tags/v$VER"
            for a in $(gh release view "v$VER" --json assets -q '.assets[].name'); do
              if [ "$a" != "e2stream-$VER.apk" ]; then gh release delete-asset "v$VER" "$a" -y; fi
            done
            gh release upload "v$VER" out/*.apk --clobber
            gh release edit "v$VER" --title "E2Stream $VER" --notes-file notes.md --draft=false --prerelease=false --latest
          else
            gh release create "v$VER" out/*.apk --title "E2Stream $VER" --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
